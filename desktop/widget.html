<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>Tavri focus widget</title>
  <link rel="stylesheet" href="./widget.css">
</head>
<body>
  <header><span class="drag"><span class="brand">t</span><strong>Tavri</strong><span class="caption">FOCUS</span></span><button id="hide" type="button" aria-label="Hide focus widget">×</button></header>
  <main><p id="title">No active task</p><p id="project">Open Tavri to choose what to work on.</p><div class="bottom"><strong id="elapsed" role="timer" aria-label="Elapsed time">00:00:00</strong><div class="actions"><button id="pause" type="button" hidden>Pause</button><button id="resume" type="button" hidden>Resume</button><button id="finish" type="button" hidden>Use time</button><button id="open" type="button">Open Tavri ↗</button></div></div></main>
  <script src="./i18n.cjs"></script>
  <script src="./widget.cjs"></script>
</body>
</html>
