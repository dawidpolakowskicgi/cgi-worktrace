name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Check shell syntax
        shell: bash
        run: |
          bash -n tavri.sh
          bash -n tavri-desktop
          bash -n tests/run.sh
          bash -n scripts/create-project-base.sh
          bash -n scripts/install.sh
          bash -n scripts/install-macos.sh
          bash -n scripts/prepare-release.sh
          node --check scripts/generate-icons.mjs
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer.cjs
          node --check desktop/theme-symbols.cjs
          node --check desktop/activity-templates.cjs
          node --check desktop/update-check.cjs
          node --check desktop/i18n.cjs
          node --check desktop/focus-store.cjs
          node --check desktop/widget-window.cjs
          node --check desktop/tavri-core.cjs
          node --check tests/test_desktop_core.mjs
          node --check tests/test_desktop_renderer.mjs

      - name: Check PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run tests
        shell: bash
        run: npm test

      - name: Test production Electron flows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./node_modules/.bin/electron --no-sandbox tests/test_desktop_integration.cjs

      - name: Test production Electron flows (macOS)
        if: runner.os == 'macOS'
        run: npm run test:desktop:integration

      - name: Smoke test installer
        shell: bash
        run: |
          install_dir="$(mktemp -d)"
          TAVRI_INSTALL_DIR="$install_dir" ./scripts/install.sh
          "$install_dir/tavri" version

      - name: Smoke test release packager
        if: runner.os == 'Linux'
        shell: bash
        run: |
          output_dir="$(mktemp -d)"
          version="$(node -p "require('./package.json').version")"
          ./scripts/prepare-release.sh "v${version}" "$output_dir"
          test -f "$output_dir/install.sh"
          test -f "$output_dir/install-macos.sh"
          test -f "$output_dir/install.ps1"
          test -f "$output_dir/tavri.sh"
          test -f "$output_dir/tavri-linux.tar.gz"
          test -f "$output_dir/tavri-macos.tar.gz"
          test -f "$output_dir/tavri-windows.zip"
          test -f "$output_dir/SHA256SUMS.txt"
          archive_listing="$(mktemp)"
          tar -tzf "$output_dir/tavri-linux.tar.gz" > "$archive_listing"
          grep -q "/package.json" "$archive_listing"
          grep -q "/scripts/install-macos.sh" "$archive_listing"
          grep -q "/desktop/main.cjs" "$archive_listing"
          grep -q "/desktop/index.html" "$archive_listing"
          grep -q "/assets/tavri-icon.icns" "$archive_listing"
          grep -q "/assets/tavri-icon.ico" "$archive_listing"
          grep -q "/assets/tavri-icon.png" "$archive_listing"
          grep -q "/desktop/i18n.cjs" "$archive_listing"
          grep -q "/desktop/focus-store.cjs" "$archive_listing"
          grep -q "/desktop/widget.html" "$archive_listing"

  windows-installer:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tavri
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "tavri-bin"
          ./scripts/install.ps1 -InstallDir $installDir -NoPathUpdate
          & (Join-Path $installDir "tavri.cmd") version
